<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>McDonald's 교육 게임</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#111;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:Arial,sans-serif;}
button{touch-action:manipulation;cursor:pointer;font-family:Arial,sans-serif;}

#wrap{
  background:#1a1a2e;
  border:3px solid #ffc72c;
  border-radius:10px;
  overflow:hidden;
  width:100vw;
  height:56.25vw;
  max-height:100vh;
  max-width:177.8vh;
  display:flex;
  flex-direction:column;
  font-size:2.2vw;
  position:relative;
}
.hdr{background:#da291c;color:#ffc72c;padding:.3em .7em;font-weight:bold;display:flex;justify-content:space-between;align-items:center;font-size:.9em;flex-shrink:0;}
.prog{display:flex;gap:.25em;padding:.25em .7em;background:#0d1117;flex-shrink:0;}
.pd{height:.35em;flex:1;border-radius:2px;background:#333;}
.pd.done{background:#00cc66;}
.pd.now{background:#ffc72c;}
.main{flex:1;position:relative;overflow:hidden;}

.scr{display:none;position:absolute;top:0;left:0;right:0;bottom:0;padding:.6em;}
.scr.on{display:flex;}

/* START */
#sc0{flex-direction:column;justify-content:center;align-items:center;gap:.4em;background:#0d1117;}
#sc0 h1{color:#ffc72c;font-size:2.5em;font-weight:900;}
#sc0 .sub{color:#da291c;font-size:1.2em;font-weight:bold;}
#sc0 .desc{color:#888;font-size:.8em;text-align:center;line-height:1.5;}

/* BREAD */
#sc1{gap:.6em;}
.lcol{width:38%;display:flex;flex-direction:column;gap:.3em;}
.rcol{flex:1;display:flex;flex-direction:column;gap:.35em;}
.ptitle{color:#ffc72c;font-size:.7em;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;}
.blist{flex:1;display:flex;flex-direction:column;gap:.28em;}
.bitem{padding:.6em;background:#0f3460;border:2px solid #2a4a80;border-radius:6px;color:#ccc;font-size:.85em;text-align:center;font-weight:bold;transition:.15s;}
.bitem.sel,.bitem:active{background:#c0392b;border-color:#ffc72c;color:#fff;}
.monitor{flex:1;background:#0a3d62;border:3px solid #555;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:.7em;}
.minner{background:#001122;border-radius:4px;padding:.6em 1.2em;text-align:center;width:100%;margin-bottom:.4em;}
.mlabel{color:#444;font-size:.6em;font-family:monospace;letter-spacing:.1em;}
.mmenu{color:#ffd700;font-size:1.6em;font-weight:bold;font-family:monospace;text-shadow:0 0 10px #ffd700;}
.mhint{color:#667;font-size:.68em;text-align:center;line-height:1.4;}
.trow{color:#ffc72c;font-size:.75em;font-family:monospace;text-align:right;}
.sum{background:#0a1628;border:1px solid #2a3a5a;border-radius:5px;padding:.35em .6em;color:#666;font-size:.72em;line-height:1.4;}
.sum b{color:#00cc66;font-weight:bold;}
.bok{padding:.55em;background:#ffc72c;color:#1a1a2e;border:none;border-radius:7px;font-size:.95em;font-weight:bold;width:100%;flex-shrink:0;}
.bok:disabled{background:#3a3a3a;color:#666;}
.bok:not(:disabled):active{background:#ffd54f;}

/* SAUCE */
#sc2{gap:.6em;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.35em;flex:1;}
.scard{background:#0f3460;border:2px solid #2a4a80;border-radius:7px;padding:.4em .25em;display:flex;flex-direction:column;align-items:center;gap:.2em;}
.scard.sel{background:#1a4a2a;border-color:#00cc66;}
.sname{color:#ccc;font-size:.65em;text-align:center;line-height:1.2;}
.sctrl{display:flex;align-items:center;gap:.2em;}
.sbtn{width:1.4em;height:1.4em;background:#ffc72c;color:#1a1a2e;border:none;border-radius:3px;font-weight:bold;font-size:.85em;display:flex;align-items:center;justify-content:center;}
.sbtn:active{background:#ffd54f;}
.scnt{color:#fff;font-weight:bold;font-size:.85em;min-width:1em;text-align:center;}

/* VEGGIE */
#sc3{flex-direction:column;gap:.45em;}
.rlabel{color:#ffc72c;font-size:.7em;font-weight:bold;margin-bottom:.15em;}
.vrow{display:flex;gap:.3em;flex-wrap:wrap;}
.vitem{padding:.5em .8em;background:#0f3460;border:2px solid #2a4a80;border-radius:6px;color:#ccc;font-size:.78em;font-weight:bold;}
.vitem.sel,.vitem:active{background:#1a5276;border-color:#00cc66;color:#fff;}

/* PATTY */
#sc4{flex-direction:column;gap:.6em;}
.prow{flex:1;display:flex;gap:.7em;justify-content:center;align-items:center;}
.pcard{flex:1;max-width:28%;padding:1em .4em;background:#0f3460;border:3px solid #2a4a80;border-radius:10px;color:#ccc;font-size:.9em;text-align:center;font-weight:bold;line-height:1.5;}
.pcard.sel,.pcard:active{background:#4a1a7a;border-color:#ffc72c;color:#fff;}

/* SCORE */
#sc5{flex-direction:column;justify-content:center;align-items:center;gap:.6em;background:#0d1117;}
.stitle{color:#ffc72c;font-size:1.5em;font-weight:bold;}
.sbox{background:#161b22;border:2px solid #ffc72c;border-radius:10px;padding:.9em 1.5em;min-width:48%;max-width:80%;}
.smenu{color:#da291c;text-align:center;font-size:1em;font-weight:bold;margin-bottom:.6em;}
.srow{display:flex;justify-content:space-between;align-items:center;padding:.25em 0;border-bottom:1px solid #1e2530;font-size:.82em;color:#bbb;}
.ok{color:#00cc66;font-weight:bold;}
.ng{color:#ff4444;font-weight:bold;}
.shint{color:#666;font-size:.65em;text-align:right;margin-bottom:.25em;}
.stot{color:#ffc72c;font-size:1.6em;font-weight:bold;text-align:center;margin-top:.4em;padding-top:.35em;border-top:2px solid #ffc72c;}
.rbtn{padding:.6em 2.5em;background:#da291c;color:#fff;border:none;border-radius:8px;font-size:1em;font-weight:bold;}
.rbtn:active{background:#e84040;}

.gbtn{padding:.6em 2.5em;background:#ffc72c;color:#1a1a2e;border:none;border-radius:8px;font-size:1.3em;font-weight:bold;margin-top:.8em;}
.gbtn:active{background:#ffd54f;}
</style>
</head>
<body>
<div id="wrap">
  <div class="hdr">
    <span>McDonald's 교육 게임</span>
    <span id="hmenu" style="color:#fff;font-size:.85em;font-weight:normal;"></span>
    <span id="htimer" style="font-family:monospace;font-size:.8em;"></span>
  </div>
  <div class="prog">
    <div class="pd" id="p0"></div>
    <div class="pd" id="p1"></div>
    <div class="pd" id="p2"></div>
    <div class="pd" id="p3"></div>
  </div>
  <div class="main">

    <div class="scr on" id="sc0">
      <h1>McDonald's</h1>
      <div class="sub">햄버거 제조 교육</div>
      <div class="desc">모니터의 메뉴를 보고<br>올바른 재료를 순서대로 선택하세요!</div>
      <button class="gbtn" id="btnStart">게임 시작</button>
    </div>

    <div class="scr" id="sc1">
      <div class="lcol">
        <div class="ptitle">빵 선택</div>
        <div class="blist" id="breadList">
          <button class="bitem" data-val="레귤러번">레귤러번</button>
          <button class="bitem" data-val="쿼터번">쿼터번</button>
          <button class="bitem" data-val="빅맥번">빅맥번</button>
          <button class="bitem" data-val="브리오슈번">브리오슈번</button>
          <button class="bitem" data-val="또띠야">또띠야</button>
        </div>
        <div class="sum" id="breadSum">선택된 빵: <b>없음</b></div>
        <button class="bok" id="btnBread" disabled>확인</button>
      </div>
      <div class="rcol">
        <div class="monitor">
          <div class="minner">
            <div class="mlabel">ORDER</div>
            <div class="mmenu" id="monMenu">---</div>
          </div>
          <div class="mhint">주문이 들어왔습니다!<br>올바른 빵을 선택하세요.</div>
        </div>
        <div class="trow" id="timerRow"></div>
      </div>
    </div>

    <div class="scr" id="sc2">
      <div class="lcol">
        <div class="ptitle">소스 현황</div>
        <div class="sum" id="sauceSum" style="flex:1;overflow-y:auto;">선택된 소스: <b>없음</b></div>
        <button class="bok" id="btnSauce">확인</button>
      </div>
      <div class="rcol">
        <div class="ptitle">소스 선택 (+ / -)</div>
        <div class="sgrid" id="sauceGrid"></div>
      </div>
    </div>

    <div class="scr" id="sc3">
      <div class="ptitle">야채 / 재료 선택</div>
      <div>
        <div class="rlabel">2단 재료</div>
        <div class="vrow" id="vrow2">
          <button class="vitem" data-name="치즈">치즈</button>
          <button class="vitem" data-name="베이컨">베이컨</button>
          <button class="vitem" data-name="1/2베이컨">1/2베이컨</button>
          <button class="vitem" data-name="양파">양파</button>
          <button class="vitem" data-name="피클">피클</button>
        </div>
      </div>
      <div>
        <div class="rlabel">1단 재료</div>
        <div class="vrow" id="vrow1">
          <button class="vitem" data-name="토마토">토마토</button>
          <button class="vitem" data-name="쉬레드">쉬레드</button>
          <button class="vitem" data-name="랜덤">랜덤</button>
          <button class="vitem" data-name="쉬레드">쉬레드</button>
          <button class="vitem" data-name="랜덤">랜덤</button>
        </div>
      </div>
      <div class="sum" id="vegSum" style="flex:1;">선택된 재료: <b>없음</b></div>
      <button class="bok" id="btnVeg">확인</button>
    </div>

    <div class="scr" id="sc4">
      <div class="ptitle">패티 선택</div>
      <div class="prow" id="pattyRow">
        <button class="pcard" data-val="함박패티">함박패티</button>
        <button class="pcard" data-val="10:1패티">10:1패티</button>
        <button class="pcard" data-val="맥치킨패티">맥치킨패티</button>
      </div>
      <div class="sum" id="pattySum">선택된 패티: <b>없음</b></div>
      <button class="bok" id="btnPatty" disabled>완료</button>
    </div>

    <div class="scr" id="sc5">
      <div class="stitle">채점 결과</div>
      <div class="sbox" id="scoreBox"></div>
      <button class="rbtn" id="btnRestart">다시 하기</button>
    </div>

  </div>
</div>
<script>
var RECIPES = {
  '치즈버거': { bread:'레귤러번', sauces:{'겨자':1,'케찹':1}, veggies:['피클','치즈'], patty:'10:1패티' },
  '불고기버거': { bread:'레귤러번', sauces:{'화이트마요':1,'불고기소스':1}, veggies:['쉬레드'], patty:'함박패티' },
  '빅맥': { bread:'빅맥번', sauces:{'빅맥소스':1}, veggies:['쉬레드','피클','치즈'], patty:'10:1패티' }
};
var SAUCES = ['프로모션소스','스페셜스모키','스파이시어니언소스','빅맥번소스','화이트마요','칠리소스','불고기소스','케찹','겨자'];
// Fix: 빅맥소스 was wrongly listed above
SAUCES[3] = '빅맥소스';

var state = { menu:'', bread:'', sauces:{}, vegEls:[], patty:'', t0:0, elapsed:0, tid:null };

function ge(id){ return document.getElementById(id); }
function qa(sel){ return document.querySelectorAll(sel); }

function show(id){
  qa('.scr').forEach(function(s){ s.classList.remove('on'); });
  ge(id).classList.add('on');
}

function prog(step){
  for(var i=0;i<4;i++){
    var d=ge('p'+i);
    d.className='pd';
    if(i<step) d.classList.add('done');
    else if(i===step) d.classList.add('now');
  }
}

function startTimer(){
  state.t0=Date.now();
  state.tid=setInterval(function(){
    state.elapsed=(Date.now()-state.t0)/1000;
    var s='⏱ '+state.elapsed.toFixed(1)+'s';
    ge('timerRow').textContent=s;
    ge('htimer').textContent=s;
  },100);
}

function stopTimer(){
  clearInterval(state.tid);
  state.elapsed=(Date.now()-state.t0)/1000;
}

function buildSauces(){
  state.sauces={};
  var g=ge('sauceGrid');
  g.innerHTML='';
  SAUCES.forEach(function(name){
    state.sauces[name]=0;
    var d=document.createElement('div');
    d.className='scard';
    d.id='sc_'+name;

    var nm=document.createElement('div');
    nm.className='sname';
    nm.textContent=name;

    var ctrl=document.createElement('div');
    ctrl.className='sctrl';

    var bm=document.createElement('button');
    bm.className='sbtn';
    bm.textContent='-';
    bm.setAttribute('data-sauce',name);
    bm.setAttribute('data-delta','-1');

    var cnt=document.createElement('span');
    cnt.className='scnt';
    cnt.id='sn_'+name;
    cnt.textContent='0';

    var bp=document.createElement('button');
    bp.className='sbtn';
    bp.textContent='+';
    bp.setAttribute('data-sauce',name);
    bp.setAttribute('data-delta','1');

    ctrl.appendChild(bm);
    ctrl.appendChild(cnt);
    ctrl.appendChild(bp);
    d.appendChild(nm);
    d.appendChild(ctrl);
    g.appendChild(d);
  });
  updateSauceSum();
}

function updateSauceSum(){
  var sel=SAUCES.filter(function(n){ return state.sauces[n]>0; })
    .map(function(n){ return n+' '+state.sauces[n]+'번'; }).join(', ');
  ge('sauceSum').innerHTML='선택된 소스: <b>'+(sel||'없음')+'</b>';
}

function countMap(arr){
  var m={};
  arr.forEach(function(x){ m[x]=(m[x]||0)+1; });
  return m;
}

function mapsEq(a,b){
  var ka=Object.keys(a).sort(), kb=Object.keys(b).sort();
  if(ka.join()!==kb.join()) return false;
  return ka.every(function(k){ return a[k]===b[k]; });
}

// ---- EVENTS ----
document.addEventListener('DOMContentLoaded', function(){

  // Start
  ge('btnStart').addEventListener('click', function(){
    var keys=Object.keys(RECIPES);
    state.menu=keys[Math.floor(Math.random()*keys.length)];
    state.bread=''; state.vegEls=[]; state.patty='';

    qa('.bitem').forEach(function(b){ b.classList.remove('sel'); });
    ge('breadSum').innerHTML='선택된 빵: <b>없음</b>';
    ge('btnBread').disabled=true;
    ge('monMenu').textContent=state.menu;
    ge('hmenu').textContent='[ '+state.menu+' ]';

    buildSauces();

    qa('.vitem').forEach(function(v){ v.classList.remove('sel'); });
    ge('vegSum').innerHTML='선택된 재료: <b>없음</b>';

    qa('.pcard').forEach(function(p){ p.classList.remove('sel'); });
    ge('pattySum').innerHTML='선택된 패티: <b>없음</b>';
    ge('btnPatty').disabled=true;

    prog(0);
    show('sc1');
    startTimer();
  });

  // Bread list
  ge('breadList').addEventListener('click', function(e){
    var btn=e.target.closest('.bitem');
    if(!btn) return;
    qa('.bitem').forEach(function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel');
    state.bread=btn.getAttribute('data-val');
    ge('breadSum').innerHTML='선택된 빵: <b>'+state.bread+'</b>';
    ge('btnBread').disabled=false;
  });

  ge('btnBread').addEventListener('click', function(){
    if(!state.bread) return;
    prog(1); show('sc2');
  });

  // Sauce buttons
  ge('sauceGrid').addEventListener('click', function(e){
    var btn=e.target.closest('.sbtn');
    if(!btn) return;
    var name=btn.getAttribute('data-sauce');
    var delta=parseInt(btn.getAttribute('data-delta'));
    state.sauces[name]=Math.max(0,(state.sauces[name]||0)+delta);
    ge('sn_'+name).textContent=state.sauces[name];
    if(state.sauces[name]>0) ge('sc_'+name).classList.add('sel');
    else ge('sc_'+name).classList.remove('sel');
    updateSauceSum();
  });

  ge('btnSauce').addEventListener('click', function(){
    prog(2); show('sc3');
  });

  // Veggie
  document.getElementById('vrow2').addEventListener('click', function(e){
    var btn=e.target.closest('.vitem');
    if(!btn) return;
    toggleVeg(btn);
  });
  document.getElementById('vrow1').addEventListener('click', function(e){
    var btn=e.target.closest('.vitem');
    if(!btn) return;
    toggleVeg(btn);
  });

  function toggleVeg(btn){
    if(btn.classList.contains('sel')){
      btn.classList.remove('sel');
      state.vegEls=state.vegEls.filter(function(v){ return v!==btn; });
    } else {
      btn.classList.add('sel');
      state.vegEls.push(btn);
    }
    var names=state.vegEls.map(function(v){ return v.getAttribute('data-name'); }).join(', ');
    ge('vegSum').innerHTML='선택된 재료: <b>'+(names||'없음')+'</b>';
  }

  ge('btnVeg').addEventListener('click', function(){
    prog(3); show('sc4');
  });

  // Patty
  ge('pattyRow').addEventListener('click', function(e){
    var btn=e.target.closest('.pcard');
    if(!btn) return;
    qa('.pcard').forEach(function(p){ p.classList.remove('sel'); });
    btn.classList.add('sel');
    state.patty=btn.getAttribute('data-val');
    ge('pattySum').innerHTML='선택된 패티: <b>'+state.patty+'</b>';
    ge('btnPatty').disabled=false;
  });

  ge('btnPatty').addEventListener('click', function(){
    if(!state.patty) return;
    stopTimer();
    var r=RECIPES[state.menu];

    var bOk=state.bread===r.bread;

    var selSauces=SAUCES.filter(function(n){ return state.sauces[n]>0; });
    var rKeys=Object.keys(r.sauces);
    var sOk=selSauces.length===rKeys.length;
    if(sOk){ rKeys.forEach(function(k){ if((state.sauces[k]||0)!==r.sauces[k]) sOk=false; }); }

    var selNames=state.vegEls.map(function(v){ return v.getAttribute('data-name'); });
    var vOk=mapsEq(countMap(selNames),countMap(r.veggies));

    var pOk=state.patty===r.patty;

    var recScore=(bOk?1:0)+(sOk?2:0)+(vOk?1:0)+(pOk?1:0);
    var t=state.elapsed;
    var spd=t<=15?5:t<=18?4:t<=21?3:t<=24?2:t<=27?1:0;
    var total=recScore+spd;

    var rSauceStr=rKeys.map(function(k){ return k+'×'+r.sauces[k]; }).join(', ');
    var pSauceStr=selSauces.map(function(k){ return k+'×'+state.sauces[k]; }).join(', ')||'없음';

    var items=[
      {label:'빵 (1점)',ok:bOk,exp:r.bread,got:state.bread},
      {label:'소스 (2점)',ok:sOk,exp:rSauceStr,got:pSauceStr},
      {label:'야채/재료 (1점)',ok:vOk,exp:r.veggies.join(', '),got:selNames.join(', ')||'없음'},
      {label:'패티 (1점)',ok:pOk,exp:r.patty,got:state.patty}
    ];

    var html='<div class="smenu">'+state.menu+'</div>';
    items.forEach(function(item){
      html+='<div class="srow"><span>'+item.label+'</span><span class="'+(item.ok?'ok':'ng')+'">'+(item.ok?'✓ 정확':'✗ 오류')+'</span></div>';
      if(!item.ok) html+='<div class="shint">정답: '+item.exp+' / 선택: '+item.got+'</div>';
    });
    html+='<div class="srow" style="margin-top:.4em"><span>레시피 점수</span><span style="color:#ffc72c">'+recScore+' / 5</span></div>';
    html+='<div class="srow"><span>스피드 ('+t.toFixed(1)+'초)</span><span style="color:#ffc72c">'+spd+' / 5</span></div>';
    html+='<div class="stot">'+total+' / 10</div>';
    ge('scoreBox').innerHTML=html;

    prog(4); show('sc5');
  });

  ge('btnRestart').addEventListener('click', function(){
    ge('hmenu').textContent='';
    ge('htimer').textContent='';
    show('sc0');
  });

});
</script>
</body>
</html>
